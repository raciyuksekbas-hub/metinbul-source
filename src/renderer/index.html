<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetinBul</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Central screen-reader announcement channel (spec §10). Permanent nodes:
       readers must be observing a live region before its text changes. -->
  <div id="a11y-live-polite" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="a11y-live-assertive" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <a class="skip-link" href="#search-input">Arama alanına geç</a>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <h1 class="logo"><span class="logo-regular">Metin</span><span class="logo-bold">Bul</span></h1>
      </div>
      <div class="header-actions">
        <button id="btn-search-areas" class="btn btn-secondary" type="button">
          <svg aria-hidden="true" focusable="false" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Arama Alanları</span>
        </button>
        <button id="btn-rescan" class="btn btn-secondary" type="button" aria-describedby="btn-rescan-desc">
          <svg aria-hidden="true" focusable="false" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Yeniden Tara</span>
        </button>
        <span id="btn-rescan-desc" class="visually-hidden">Bilgisayardaki belgeleri yeniden tarar ve indeksi günceller.</span>
      </div>
    </header>

    <!-- Optional Notification / Update Banner -->
    <div id="update-banner" class="update-banner hidden" role="region" aria-label="Güncelleme bildirimi">
      <div class="update-banner-content">
        <span class="update-dot" aria-hidden="true"></span>
        <span id="update-banner-text" class="update-banner-text">Yeni sürüm kullanılabilir</span>
        <button id="btn-view-update" class="btn-update-action" type="button">Güncellemeyi Gör</button>
      </div>
      <button id="btn-dismiss-update" class="btn-icon update-dismiss" type="button" aria-label="Güncelleme bildirimini kapat">
        <span aria-hidden="true">✕</span>
      </button>
    </div>

    <!-- Search Section -->
    <section class="search-section" role="search" aria-label="Belge arama">
      <div class="search-box">
        <svg class="search-icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <label class="visually-hidden" for="search-input">Belgelerde ara</label>
        <input type="search" id="search-input" placeholder="Belgelerinizde ara…" autofocus
               autocomplete="off" spellcheck="false" aria-describedby="search-input-hint">
        <span id="search-input-hint" class="visually-hidden">Aramak istediğiniz kelime veya ifadeyi yazın. Sonuçlar siz yazdıkça listelenir.</span>
        <button id="btn-clear-search" class="btn-icon hidden" type="button" aria-label="Aramayı temizle">
          <span aria-hidden="true">✕</span>
        </button>
      </div>
    </section>

    <!-- Status Line -->
    <div class="status-bar">
      <span id="status-text" class="status-text">Hazırlanıyor…</span>
    </div>

    <!-- Search Results -->
    <main class="results-container" id="results-container">
      <div id="results-header" class="results-header hidden">
        <span id="results-count">0 sonuç</span>
        <label class="visually-hidden" for="sort-select">Sonuçları sırala</label>
        <select id="sort-select" class="sort-select">
          <option value="modified">Son Düzenlenen</option>
          <option value="oldest">En Eski</option>
          <option value="relevance">Alaka Düzeyi</option>
        </select>
      </div>
      <div id="results-list" class="results-list">
        <div class="placeholder-state">
          <p>Belgelerinizde aramak istediğiniz ifadeyi yazın.</p>
        </div>
      </div>
    </main>

    <!-- Thin Footer Status Bar -->
    <footer class="app-footer">
      <div class="footer-status-row">
        <span id="footer-text" class="footer-text"></span>
        <span id="dataless-hint" class="footer-action-link hidden"></span>
        <nav class="footer-actions" aria-label="Uygulama eylemleri">
          <button id="action-theme-toggle" class="footer-action-link" type="button">Tema: Koyu</button>
          <span class="footer-divider" aria-hidden="true">•</span>
          <button id="action-shortcut" class="footer-action-link" type="button">Ayarlar</button>
          <span class="footer-divider" aria-hidden="true">•</span>
          <button id="action-search-areas" class="footer-action-link" type="button">Arama Alanları</button>
          <span class="footer-divider" aria-hidden="true">•</span>
          <!-- Telif and Geri Bildirim live in Ayarlar › Hakkında now. -->
          <button id="action-about" class="footer-action-link" type="button">Hakkında</button>
        </nav>
      </div>
    </footer>

    <!-- First-Run Onboarding (no close affordance by design: a choice is required).
         The form inside is the shared setup view (settings/onboarding-view.ts). -->
    <div id="onboarding-overlay" class="popover-overlay hidden">
      <div class="popover-card popover-card-wide" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
        <h2 id="onboarding-title" class="visually-hidden">MetinBul kurulumu</h2>
        <div id="onboarding-body" class="popover-body"></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
